name: 'ecommerce_analytics'
version: '1.0.0'
config-version: 2
profile: 'ecommerce_analytics'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
docs-paths: ["models"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "dev.duckdb"
  - "dev.duckdb.wal"

models:
  ecommerce_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  ecommerce_analytics:
    +schema: raw
    +quote_columns: false
